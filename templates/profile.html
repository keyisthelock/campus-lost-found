{% extends 'base.html' %}{% block content %}<span class="eyebrow">ACCOUNT SETTINGS</span><h1>Your campus profile.</h1><form class="panel narrow" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="name">Display name</label><input class="form-control" id="name" name="name" required maxlength="80" value="{{ g.user.name }}"><label for="email">Email address</label><input class="form-control" id="email" disabled value="{{ g.user.email }}"><p class="muted mt-4">Role: {{ g.user.role|capitalize }} · Member since {{ g.user.created_at.strftime('%b %Y') }}</p><button class="btn btn-primary">Save profile ↗</button></form>{% endblock %}
